name: CI

on:
  push:
    branches:
      - main
      - responsive-ui
      - 'feature/**'
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check (all packages)
        run: bun run typecheck

      - name: Build Monorepo (Apps & Packages)
        run: bun run build

      - name: Run Test Suite (Crypto, Auth & Sync)
        run: bun test
        env:
          NODE_ENV: test
          AUTH_SECRET: 'ci-test-jwt-hmac-sha256-secret-min-32-chars-long'
